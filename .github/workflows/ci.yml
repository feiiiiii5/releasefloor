name: Validate ReleaseFloor
on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check source and behavior
        run: |
          go version
          go vet ./...
          go test -race -count=1 ./...
      - name: Generate original metadata examples
        run: go run ./examples/generate --out output/demo
      - name: Build the native command
        run: |
          mkdir -p output/bin
          go build -trimpath -o output/bin/ ./cmd/releasefloor
      - name: Exercise the native process and report files
        run: python scripts/verify_cli.py --binary output/bin/releasefloor --demo output/demo

name: Build and publish the experimental release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check the release compiler and create original examples
        run: |
          go test ./...
          go run ./examples/generate --out output/demo
          go build -trimpath -o output/releasefloor ./cmd/releasefloor
      - name: Build the six host commands with license notices
        run: python3 scripts/build_release.py --out dist
      - name: Verify the Linux package and finish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --release-id 436616426 --directory dist --examples output/demo --tool output/releasefloor
